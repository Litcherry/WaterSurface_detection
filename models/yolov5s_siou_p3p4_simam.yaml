# YOLOv5s with SimAM on P3 and P4 Scales Only
nc: 9
depth_multiple: 0.33
width_multiple: 0.50
anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8
  - [30, 61, 62, 45, 59, 119] # P4/16
  - [116, 90, 156, 198, 373, 326] # P5/32

# YOLOv5 backbone
backbone: [
    [-1, 1, Conv, [64, 6, 2, 2]], # 0-P1/2
    [-1, 1, Conv, [128, 3, 2]], # 1-P2/4
    [-1, 3, C3, [128]],
    [-1, 1, Conv, [256, 3, 2]], # 3-P3/8
    [-1, 6, C3, [256]],
    [-1, 1, Conv, [512, 3, 2]], # 5-P4/16
    [-1, 9, C3, [512]],
    [-1, 1, Conv, [1024, 3, 2]], # 7-P5/32
    [-1, 3, C3, [1024]],
    [-1, 1, SPPF, [1024, 5]], # 9
  ]

# YOLOv5 head
head: [
    [-1, 1, Conv, [512, 1, 1]], # 10
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 6], 1, Concat, [1]],
    [-1, 3, C3, [512, False]], # 13

    [-1, 1, Conv, [256, 1, 1]], # 14
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, Concat, [1]],
    [-1, 3, C3, [256, False]], # 17 (P3尺度特征输出)
    [-1, 1, SimAM, [256]], # 18 <- 对P3尺度进行SimAM增强

    [-1, 1, Conv, [128, 3, 2]], # 19 (从P3下采样回P4)
    [[-1, 14], 1, Concat, [1]], # 20 (连接第14层的特征)
    [-1, 3, C3, [256, False]], # 21 (P4尺度特征输出)
    [-1, 1, SimAM, [256]], # 22 <- 对P4尺度进行SimAM增强

    [-1, 1, Conv, [256, 3, 2]], # 23 (从P4下采样回P5)
    [[-1, 10], 1, Concat, [1]], # 24 (连接第10层的特征)
    [-1, 3, C3, [512, False]], # 25 (P5尺度特征输出, 不加SimAM)

    [[18, 22, 25], 1, Detect, [nc, anchors]], # 26 (注意输入索引已对齐)
  ]
