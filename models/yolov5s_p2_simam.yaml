# YOLOv5s_P2_SimAM.yaml (4检测头保研版)
nc: 9
depth_multiple: 0.33
width_multiple: 0.50
anchors:
  - [5,6, 8,14, 15,11]  # P2/4 (新增)
  - [10,13, 16,30, 33,23]  # P3/8
  - [30,61, 62,45, 59,119]  # P4/16
  - [116,90, 156,198, 373,326]  # P5/32

backbone:
  [[-1, 1, Conv, [64, 6, 2, 2]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],   # 1-P2/4
   [-1, 3, C3, [128]],           # 2
   [-1, 1, Conv, [256, 3, 2]],   # 3-P3/8
   [-1, 6, C3, [256]],           # 4
   [-1, 1, Conv, [512, 3, 2]],   # 5-P4/16
   [-1, 9, C3, [512]],           # 6
   [-1, 1, Conv, [1024, 3, 2]],  # 7-P5/32
   [-1, 3, C3, [1024]],          # 8
   [-1, 1, SPPF, [1024, 5]],     # 9
  ]

head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 6], 1, Concat, [1]],    # cat backbone P4
   [-1, 3, C3, [512, False]],    # 13

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 4], 1, Concat, [1]],    # cat backbone P3
   [-1, 3, C3, [256, False]],    # 17

   # --- 新增 P2 分支开始 ---
   [-1, 1, Conv, [128, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 2], 1, Concat, [1]],    # cat backbone P2 (第2层是P2尺度)
   [-1, 3, C3, [128, False]],    # 21 (P2 尺度输出)
   # --- 新增 P2 分支结束 ---

   [-1, 1, Conv, [128, 3, 2]],
   [[-1, 18], 1, Concat, [1]],   # 结合 P3
   [-1, 3, C3, [256, False]],    # 24 (P3 尺度输出)

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 14], 1, Concat, [1]],   # 结合 P4
   [-1, 3, C3, [512, False]],    # 27 (P4 尺度输出)

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 10], 1, Concat, [1]],   # 结合 P5
   [-1, 3, C3, [1024, False]],   # 30 (P5 尺度输出)

   # 加入 SimAM 显著性增强
   [21, 1, SimAM, [128]],        # 31 (P2)
   [24, 1, SimAM, [256]],        # 32 (P3)
   [27, 1, SimAM, [512]],        # 33 (P4)
   [30, 1, SimAM, [1024]],       # 34 (P5)

   [[31, 32, 33, 34], 1, Detect, [nc, anchors]],   # 4检测头输出
  ]